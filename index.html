// ═══════════════════════════════════════════════════════
// FORCE SIMULATION
// ═══════════════════════════════════════════════════════

function forceStep() {
  const REP = 13000, SPRING_LEN = 155, SPRING_K = 0.04, GRAV = 0.013, DAMP = 0.82;
  const cx = W/2, cy = H/2;

  NODES.forEach(n => { n.fx = 0; n.fy = 0; });

  // Repulsion
  for (let i=0; i<NODES.length; i++) {
    for (let j=i+1; j<NODES.length; j++) {
      const a=NODES[i], b=NODES[j];
      const dx=b.x-a.x, dy=b.y-a.y;
      const d2 = dx*dx+dy*dy || 1, d = Math.sqrt(d2);
      const f = REP/d2;
      a.fx -= f*dx/d; a.fy -= f*dy/d;
      b.fx += f*dx/d; b.fy += f*dy/d;
    }
  }

  // Spring attraction on edges (unique pairs)
  const visited = new Set();
  EDGES.forEach(e => {
    if (!e.sn || !e.tn) return;
    const key = [e.s,e.t].sort().join('|');
    if (visited.has(key)) return;
    visited.add(key);
    const a=e.sn, b=e.tn;
    const dx=b.x-a.x, dy=b.y-a.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-SPRING_LEN)*SPRING_K;
    a.fx+=f*dx/d; a.fy+=f*dy/d;
    b.fx-=f*dx/d; b.fy-=f*dy/d;
  });

  // Gravity toward center
  NODES.forEach(n => {
    n.fx += (cx-n.x)*GRAV;
    n.fy += (cy-n.y)*GRAV;
  });

  // 星圖分圈：與 Peisuky 關係越近的放越內圈、越遠的推向外圈
  const RING1  = Math.min(W, H) * 0.30;                    // 第一圈半徑（直接關係）
  const RSTEP  = Math.min(W, H) * 0.24;                    // 每多一跳往外多少
  const RING_K = 0.09;
  NODES.forEach(n => {
    const dx = n.x - cx, dy = n.y - cy;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    const target = n.hop === 0 ? 0 : RING1 + (n.hop - 1) * RSTEP;
    const f = (target - d) * RING_K;
    n.fx += f * dx / d;
    n.fy += f * dy / d;
  });

  NODES.forEach(n => {
    n.vx = (n.vx + n.fx)*DAMP;
    n.vy = (n.vy + n.fy)*DAMP;
    n.x += n.vx;
    n.y += n.vy;
  });
}

function runSim(steps=400) {
  for (let i=0; i<steps; i++) forceStep();
}

// 圓框防重疊：把互相重疊的圓形往外推開（星圖佈局用）
// pad 預留 idle drift 的飄移幅度，避免飄動時碰在一起
function separateCircles(pad = 18, iters = 80) {
  for (let k = 0; k < iters; k++) {
    let moved = false;
    for (let i = 0; i < NODES.length; i++) {
      for (let j = i + 1; j < NODES.length; j++) {
        const a = NODES[i], b = NODES[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.sqrt(dx*dx + dy*dy);
        const min = a.size + b.size + pad;
        if (d >= min) continue;
        if (d < 0.01) { dx = 1; dy = 0; d = 1; }  // 完全重合時隨便挑個方向
        const push = (min - d) / 2 + 0.5;
        a.x -= push * dx / d; a.y -= push * dy / d;
        b.x += push * dx / d; b.y += push * dy / d;
        moved = true;
      }
    }
    if (!moved) break;
  }
}

function storeOverview() {
  NODES.forEach(n => { n.ox=n.x; n.oy=n.y; n.tx=n.x; n.ty=n.y; });
}

// ═══════════════════════════════════════════════════════
// TREE LAYOUT（族譜：由上往下分世代）
// ═══════════════════════════════════════════════════════

function computeDepths() {
  const depth = {};
  const hasParent = new Set();
  EDGES.forEach(e => { if (e.type === 'parent') hasParent.add(e.t); });
  // 世代根源：有子嗣但自己沒有父輩
  EDGES.forEach(e => {
    if (e.type === 'parent' && !hasParent.has(e.s)) depth[e.s] = 0;
  });
  if (depth['Peisuky'] == null) depth['Peisuky'] = 0;

  // 親子連線往下推（標籤含「孫」跨兩代）
  for (let iter = 0; iter < 10; iter++) {
    let changed = false;
    EDGES.forEach(e => {
      if (e.type !== 'parent' || depth[e.s] == null) return;
      const d = depth[e.s] + (e.label.includes('孫') ? 2 : 1);
      if (depth[e.t] == null || d > depth[e.t]) { depth[e.t] = d; changed = true; }
    });
    if (!changed) break;
  }
  // 其餘關係（伴侶/同盟/管家/朋友）放在同一代
  for (let iter = 0; iter < 10; iter++) {
    let changed = false;
    EDGES.forEach(e => {
      if (e.type === 'parent') return;
      if (depth[e.s] != null && depth[e.t] == null) { depth[e.t] = depth[e.s]; changed = true; }
      else if (depth[e.t] != null && depth[e.s] == null) { depth[e.s] = depth[e.t]; changed = true; }
    });
    if (!changed) break;
  }
  NODES.forEach(n => { if (depth[n.id] == null) depth[n.id] = 0; });
  return depth;
}

function applyTreeLayout() {
  const depth = computeDepths();
  // 特殊層級：管家在 Peisuky 與兒子輩中間、阿亂比 Peisuky 高一點
  NODES.forEach(n => { if (n.group === 'staff') depth[n.id] = 0.5; });
  depth['多多'] = 0.5;  // 多多歸入管家幕僚層
  depth['Ivan'] = 0.5;  // Ivan 跟多多同層
  depth['阿泉'] = 0.5;  // 阿泉歸入管家幕僚層
  depth['嗷嗷'] = 0;    // 孫輩的爸爸，排在本家同輩層
  depth['騰騰'] = 0;
  depth['9P'] = 0;      // 雖是騰騰兒子，仍留在本家同輩層
  depth['阿亂'] = -0.4;

  const rows = {};
  NODES.forEach(n => { (rows[depth[n.id]] = rows[depth[n.id]] || []).push(n); });
  const depths = Object.keys(rows).map(Number).sort((a, b) => a - b);
  const topY = 130;
  // 每個輩分等距排列（依排數，不依世代值）
  const rowStep = Math.max(150, Math.min(215, (H - 260) / Math.max(1, depths.length - 1)));
  const bandH = Math.min(124, rowStep - 26);  // 色帶高度 < 排距，保證不重疊

  // 世代標尺資料（含每排範圍與代表色，供長條背景使用）
  const GEN_LABELS = { '-0.4':'神壇', '0':'本家・同輩', '0.5':'管家幕僚', '1':'子嗣', '2':'孫輩' };
  const GEN_COLORS = ['#ffb86c', '#ff79c6', '#f1fa8c', '#50fa7b', '#bd93f9', '#8be9fd'];
  genRows = [];

  depths.forEach((d, ri) => {
    const row = rows[d];
    // 排序：盡量靠近上一代的親屬（barycenter），同代伴侶靠在一起
    row.forEach(n => {
      const ups = n.adj.filter(a => depth[a.peer.id] < d && a.peer._tx != null).map(a => a.peer._tx);
      if (ups.length) {
        n._key = ups.reduce((s, v) => s + v, 0) / ups.length;
      } else {
        const same = n.adj.filter(a => depth[a.peer.id] === d).map(a => a.peer.gx);
        n._key = same.length ? same.reduce((s, v) => s + v, 0) / same.length + 1 : n.gx;
      }
    });
    row.sort((a, b) => a._key - b._key);

    // 交往/伴侶關係的人強制排在旁邊（同排分群後攤平）
    // 複數伴侶：交替放在該角色的右、左兩側
    const cidx = {};
    const clusters = [];
    const partnerCount = {};
    row.forEach(n => { cidx[n.id] = clusters.length; clusters.push([n]); });
    const FORCE_ADJ = new Set(['澤仔|傑德']);  // 強制排在旁邊的組合
    EDGES.forEach(e => {
      const isPair = e.type === 'romantic' || e.type === 'partner' ||
                     FORCE_ADJ.has(e.s + '|' + e.t) || FORCE_ADJ.has(e.t + '|' + e.s);
      if (!isPair) return;
      const ci = cidx[e.s], cj = cidx[e.t];
      if (ci == null || cj == null || ci === cj) return;
      const a = clusters[ci], b = clusters[cj];
      const anchor = a.find(n => n.id === e.s || n.id === e.t);
      const pos = a.indexOf(anchor);
      const cnt = partnerCount[anchor.id] || 0;
      if (cnt % 2 === 0) a.splice(pos + 1, 0, ...b);  // 第一位放右邊
      else               a.splice(pos, 0, ...b);       // 第二位放左邊
      partnerCount[anchor.id] = cnt + 1;
      b.forEach(n => { cidx[n.id] = ci; });
      clusters[cj] = [];
    });
    const ordered = [];
    clusters.forEach(c => ordered.push(...c));

    // 本家同輩排：電特固定在 Peisuky 左邊、偷肉將固定在右邊
    if (d === 0 && ordered.some(n => n.id === 'Peisuky')) {
      const pull = id => {
        const i = ordered.findIndex(n => n.id === id);
        return i === -1 ? null : ordered.splice(i, 1)[0];
      };
      const dt = pull('電特'), tr = pull('偷肉將');
      let pi = ordered.findIndex(n => n.id === 'Peisuky');
      if (dt) { ordered.splice(pi, 0, dt); pi++; }
      if (tr) { ordered.splice(pi + 1, 0, tr); }
    }

    const span = Math.min(W - 180, (ordered.length - 1) * 115);
    const startX = W / 2 - span / 2;
    ordered.forEach((n, i) => {
      n._tx = ordered.length === 1 ? W / 2 : startX + span * (i / (ordered.length - 1));
      n.ox = n._tx;
      n.oy = topY + ri * rowStep;  // 等距排列
    });

    // Peisuky 所在排整排平移，讓 Peisuky 落在正中間
    const pei = ordered.find(n => n.id === 'Peisuky');
    if (pei) {
      const off = W / 2 - pei.ox;
      ordered.forEach(n => { n.ox += off; n._tx += off; });
    }

    // 管家幕僚排：固定順序、等距排列，整排以 Peisuky 為中心
    if (d === 0.5) {
      const peiX = nodeMap['Peisuky'] ? nodeMap['Peisuky'].ox : W / 2;
      const gap = 115;  // 與其他層的角色間距一致
      const STAFF_ORDER = ['夏目澤', 'Kulas', '阿泉', '動特', '米角', 'サトシ', '多多', 'Ivan'];
      const STAFF_X = {};
      STAFF_ORDER.forEach((id, i) => { STAFF_X[id] = peiX + (i - (STAFF_ORDER.length - 1) / 2) * gap; });
      ordered.forEach(n => {
        if (STAFF_X[n.id] != null) { n.ox = STAFF_X[n.id]; n._tx = n.ox; }
      });
    }

    // 同排圓框防重疊：由左至右保證最小間距（圓半徑相加 + 邊距）
    {
      const PAD = 14;
      const byX = [...ordered].sort((a, b) => a.ox - b.ox);
      let pushed = false;
      for (let i = 1; i < byX.length; i++) {
        const prev = byX[i-1], cur = byX[i];
        const min = prev.size + cur.size + PAD;
        if (cur.ox - prev.ox < min) { cur.ox = prev.ox + min; pushed = true; }
      }
      if (pushed) {
        // 推開後重新置中（Peisuky 排以 Peisuky 為中心）
        const pei2 = byX.find(n => n.id === 'Peisuky');
        const off2 = pei2 ? W/2 - pei2.ox
                          : W/2 - (Math.min(...byX.map(n => n.ox)) + Math.max(...byX.map(n => n.ox))) / 2;
        byX.forEach(n => { n.ox += off2; });
      }
      byX.forEach(n => { n._tx = n.ox; });
    }

    genRows.push({
      y: topY + ri * rowStep,
      bandH: bandH,
      label: GEN_LABELS[String(d)] || `第 ${d} 代`,
      color: GEN_COLORS[genRows.length % GEN_COLORS.length],
      x0: Math.min(...ordered.map(n => n.ox)),
      x1: Math.max(...ordered.map(n => n.ox)),
    });
  });
  NODES.forEach(n => { delete n._tx; delete n._key; });
}

function setFocus(node) {
  focused = node;
  mode = 'focus';
  addRipple(node);

  // 手機：面板佔據下方，聚焦中心往上移
  const isMobile = W <= 640;
  const fw = W/2, fh = isMobile ? H*0.36 : H/2;
  node.tx = fw; node.ty = fh;

  // Unique neighbors
  const peerMap = {};
  node.adj.forEach(a => { peerMap[a.peer.id] = a.peer; });
  const peers = Object.values(peerMap);

  // 聚焦者放大倍率：保證比所有相連角色都大
  const maxPeer = peers.length ? Math.max(...peers.map(p => p.size)) : 0;
  node.fScl = Math.max(1.35, (maxPeer * 1.25) / node.size);

  const R = Math.min(W, H) * 0.28;
  peers.forEach((p, i) => {
    const angle = (i / peers.length) * Math.PI*2 - Math.PI/2;
    p.tx = fw + Math.cos(angle)*R;
    p.ty = fh + Math.sin(angle)*R;
  });

  // Push out distant nodes
  const active = new Set([node.id, ...peers.map(p=>p.id)]);
  NODES.forEach(n => {
    if (active.has(n.id)) return;
    const dx=n.x-fw, dy=n.y-fh, d=Math.sqrt(dx*dx+dy*dy)||1;
    n.tx = fw + (dx/d)*Math.max(700, d+200);
    n.ty = fh + (dy/d)*Math.max(700, d+200);
  });

  // Reset camera to center
  tcx=0; tcy=0;

  document.getElementById('btn-back').style.display = 'block';
  updatePanel(node);
}

function resetOverview() {
  mode = 'overview';
  focused = null;
  NODES.forEach(n => { n.tx=n.ox; n.ty=n.oy; });
  tcx=0; tcy=0;
  document.getElementById('btn-back').style.display = 'none';
  document.getElementById('panel').classList.remove('show');
}

// ═══════════════════════════════════════════════════════
// INFO PANEL
// ═══════════════════════════════════════════════════════

function updatePanel(node) {
  document.getElementById('panel-name').textContent = node.label;

  // Collect unique relationships
  const seen = new Set();
  const items = [];
  node.adj.forEach(a => {
    // 有方向性的關係：從來源端看用 labelFrom、從目標端看用 labelTo
    // （例：騰騰→犬神子夜「爸爸」，騰騰面板顯示 labelFrom「兒子」）
    const lbl = (a.edge.s === node.id)
      ? (a.edge.labelFrom || a.edge.label)
      : (a.edge.labelTo   || a.edge.label);
    const key = a.peer.id + '|' + lbl;
    if (seen.has(key)) return;
    seen.add(key);
    items.push({ peer: a.peer.label, label: lbl, type: a.edge.type });
  });

  const relEl = document.getElementById('panel-rels');
  if (items.length === 0) {
    relEl.innerHTML = '<span style="color:#44475a;font-size:12px">暫無記錄的關係</span>';
  } else {
    relEl.innerHTML = items.map(r => {
      const c = ECOLOR[r.type] || '#6272a4';
      return `<span class="tag" style="color:${c};border-color:${c}44">${r.label}：${r.peer}</span>`;
    }).join('');
  }

  // 關係統計小計
  const TYPE_NAMES = { parent:'親族', romantic:'伴侶', partner:'伴侶', alliance:'同盟', staff:'幕僚', friend:'朋友', other:'其他' };
  const counts = {};
  items.forEach(r => { const nm = TYPE_NAMES[r.type] || '其他'; counts[nm] = (counts[nm]||0)+1; });
  document.getElementById('panel-stats').textContent =
    Object.entries(counts).map(([k,v]) => `${k} ${v}`).join(' · ');

  document.getElementById('panel').classList.add('show');
}

// Starfield（三層視差 + 閃爍）
const stars = Array.from({length:170}, ()=>({
  x: Math.random()*4000-2000,
  y: Math.random()*4000-2000,
  r: Math.random()*1.2+.2,
  a: Math.random()*.35+.05,
  z: [.3, .6, 1][Math.floor(Math.random()*3)],  // 視差層
  tw: .5 + Math.random()*1.5,                    // 閃爍速度
  ph: Math.random()*Math.PI*2,
}));

function lerp(a, b, t) { return a+(b-a)*t; }

let nowT = 0;

function drawBackground() {
  ctx.fillStyle = '#0d0b1a';
  ctx.fillRect(0, 0, W, H);
  stars.forEach(s=>{
    const sx = s.x*zoom + W/2 + cx*s.z;   // 依層深做視差位移
    const sy = s.y*zoom + H/2 + cy*s.z;
    if (sx<-10 || sx>W+10 || sy<-10 || sy>H+10) return;
    const tw = .7 + .3*Math.sin(nowT*s.tw + s.ph);
    ctx.beginPath();
    ctx.arc(sx, sy, s.r*(.55+.5*s.z), 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${s.a*tw})`;
    ctx.fill();
  });
}

// 世代標尺（族譜模式）
let genRows = [];
function drawGenRuler() {
  if (layoutMode!=='tree' || mode!=='overview') return;
  ctx.save();
  ctx.font = '14px "Noto Sans TC",sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  genRows.forEach(g=>{
    // 同輩長條背景（含淡淡外框）
    const bx = g.x0 - 70, bw = g.x1 - g.x0 + 140;
    const bh = g.bandH, by = g.y - bh/2 - 4;
    ctx.fillStyle = g.color + '12';
    roundRect(bx, by, bw, bh, 28);
    ctx.fill();
    ctx.strokeStyle = g.color + '26';
    ctx.lineWidth = 1;
    roundRect(bx, by, bw, bh, 28);
    ctx.stroke();
    // 世代標籤（帶內側左上角）
    ctx.fillStyle = g.color + 'aa';
    ctx.fillText(g.label, bx + 14, by + 18);
  });
  ctx.restore();
}

// 點擊漣漪
const ripples = [];
function addRipple(n) {
  ripples.push({ x:n.x, y:n.y, t0:performance.now()/1000, color:n.color });
}
function drawRipples(t) {
  for (let i=ripples.length-1; i>=0; i--) {
    const rp = ripples[i], age = t - rp.t0;
    if (age > .7) { ripples.splice(i,1); continue; }
    const k = age/.7;
    ctx.save();
    ctx.globalAlpha = (1-k)*.5;
    ctx.strokeStyle = rp.color;
    ctx.lineWidth = 2*(1-k)+.5;
    ctx.beginPath();
    ctx.arc(rp.x, rp.y, 24+k*80, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
}

// 線粗依關係權重：親子最粗、朋友最細
const EWEIGHT = { parent:2.2, romantic:1.8, partner:1.8, alliance:1.5, staff:1.5, friend:1.1, other:1.1 };

function drawEdge(e) {
  const a=e.sn, b=e.tn;
  if (!a||!b) return;

  const isFocusEdge = focused && (a.id===focused.id||b.id===focused.id);
  const isHoverEdge = hovered && (a.id===hovered.id||b.id===hovered.id);
  let alpha = mode==='focus'
    ? (isFocusEdge ? .85 : .04)
    : (isHoverEdge ? .9 : .25);
  // 進場動畫：兩端都出現後線才浮現
  const intro = Math.min(a.introA==null?1:a.introA, b.introA==null?1:b.introA);
  alpha *= intro;
  if (alpha < .02) return;

  const color = ECOLOR[e.type] || '#6272a4';
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = (EWEIGHT[e.type]||1.2) + (isFocusEdge ? .8 : 0);

  // 聚焦 / hover 時連線發光
  if (isFocusEdge || isHoverEdge) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
  }

  const treeFlat = layoutMode==='tree' && mode==='overview';

  if (treeFlat && (e.type==='romantic'||e.type==='partner')) {
    // 族譜：伴侶用傳統雙橫線
    ctx.setLineDash([]);
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    const px=-dy/d*2.2, py=dx/d*2.2;
    ctx.beginPath();
    ctx.moveTo(a.x+px, a.y+py); ctx.lineTo(b.x+px, b.y+py);
    ctx.moveTo(a.x-px, a.y-py); ctx.lineTo(b.x-px, b.y-py);
    ctx.stroke();
  } else {
    if (e.type==='romantic'||e.type==='partner') ctx.setLineDash([5,5]);
    else if (e.type==='alliance') ctx.setLineDash([8,4]);
    else ctx.setLineDash([]);

    ctx.beginPath();
    if (treeFlat && Math.abs(a.y - b.y) > 6) {
      // 族譜：所有跨排關係一律走直角轉角線（匯流排在下方角色上方）
      const top = a.y < b.y ? a : b, bot = a.y < b.y ? b : a;
      const busY = bot.y - 70;
      ctx.moveTo(top.x, top.y);
      ctx.lineTo(top.x, busY);
      ctx.lineTo(bot.x, busY);
      ctx.lineTo(bot.x, bot.y);
    } else {
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);  // 同排：水平直線
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
}

// 關係線說明文字（聚焦模式，含避讓）
function drawEdgeLabels() {
  if (mode !== 'focus' || !focused) return;

  const seen = new Set();
  EDGES.forEach(e => {
    if (!e.sn || !e.tn) return;
    if (e.sn.id !== focused.id && e.tn.id !== focused.id) return;
    const key = [e.s, e.t].sort().join('|') + e.label;
    if (seen.has(key)) return;
    seen.add(key);

    const a = e.sn, b = e.tn;
    const color = ECOLOR[e.type] || '#6272a4';
    // 有方向性的關係：聚焦來源端用 labelFrom、聚焦目標端用 labelTo
    const lbl = (e.s === focused.id) ? (e.labelFrom || e.label) : (e.labelTo || e.label);
    ctx.font = '13px "Noto Sans TC", sans-serif';
    const tw = ctx.measureText(lbl).width + 14;

    // 候選位置：沿線不同比例，優先沿用上一幀
    let fracs = [.5, .42, .58, .34, .66, .27, .73];
    if (e.lfrac != null) fracs = [e.lfrac, ...fracs.filter(f => f !== e.lfrac)];

    let chosen = null, chosenFrac = .5;
    for (const f of fracs) {
      const mx = a.x + (b.x-a.x)*f, my = a.y + (b.y-a.y)*f;
      const rc = { x: mx-tw/2, y: my-11, w: tw, h: 22 };
      let bad = placedRects.some(p => rectsOverlap(p, rc));
      if (!bad) bad = NODES.some(m => circleRectOverlap(m.x, m.y, m.size*(m.sclCur||1)+4, rc));
      if (!bad) { chosen = rc; chosenFrac = f; break; }
    }
    if (!chosen) {
      const mx = a.x + (b.x-a.x)*.5, my = a.y + (b.y-a.y)*.5;
      chosen = { x: mx-tw/2, y: my-11, w: tw, h: 22 };
      chosenFrac = .5;
    }
    e.lfrac = chosenFrac;
    placedRects.push(chosen);

    const mx = chosen.x + chosen.w/2, my = chosen.y + chosen.h/2;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = .8;
    ctx.fillStyle = 'rgba(13,11,26,.88)';
    roundRect(chosen.x, chosen.y, chosen.w, chosen.h, 4);
    ctx.fill();
    ctx.globalAlpha = .9;
    ctx.fillStyle = color;
    ctx.fillText(lbl, mx, my);
    ctx.restore();
  });
}

function drawNode(n) {
  const isFocused  = focused && n.id===focused.id;
  const isNeighbor = focused && n.adj.some(a=>a.peer.id===focused.id);
  const isActive   = mode==='overview' || isFocused || isNeighbor;
  const isHovered  = hovered && hovered.id===n.id;

  const introA = n.introA == null ? 1 : n.introA;
  if (introA <= 0.01) return;
  const alpha = (isActive ? 1 : 0.1) * introA;
  const scl   = (n.sclCur == null ? 1 : n.sclCur) * (.55 + .45*introA);  // 進場彈出
  const r     = n.size * scl;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(n.x, n.y);

  // Glow
  if (isActive) {
    const gr = r * 2;
    const grd = ctx.createRadialGradient(0,0,r*.4,0,0,gr);
    grd.addColorStop(0, n.color+'55');
    grd.addColorStop(1, n.color+'00');
    ctx.beginPath();
    ctx.arc(0, 0, gr, 0, Math.PI*2);
    ctx.fillStyle = grd;
    ctx.fill();
  }

  // Circle fill or image
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI*2);
  const nImg = nodeImgs[n.id];
  if (nImg && nImg.complete && nImg.naturalWidth > 0) {
    ctx.save();
    ctx.clip();
    // 底色：與框框同色、50% 不透明度
    ctx.fillStyle = n.color + '80';
    ctx.fill();
    ctx.drawImage(nImg, -r, -r, r*2, r*2);
    ctx.restore();
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI*2);
  } else {
    const grad = ctx.createRadialGradient(-r*.25,-r*.25,0,0,0,r);
    grad.addColorStop(0, lighten(n.color, 50));
    grad.addColorStop(1, n.color);
    ctx.fillStyle = grad;
    ctx.fill();
    // Inner label (1-2 chars)
    const inner = n.label.length<=2 ? n.label : n.label[0];
    ctx.font = `${Math.max(9,r*.52)}px "Noto Sans TC",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#0d0b1a';
    ctx.globalAlpha = alpha * .9;
    if (r >= 14) ctx.fillText(inner, 0, 1);
  }

  // Border（聚焦時：旋轉漸層光環）
  if (isFocused && ctx.createConicGradient) {
    const ring = ctx.createConicGradient(nowT*1.6, 0, 0);
    ring.addColorStop(0,   '#ff79c6');
    ring.addColorStop(.33, '#bd93f9');
    ring.addColorStop(.66, '#8be9fd');
    ring.addColorStop(1,   '#ff79c6');
    ctx.strokeStyle = ring;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(0, 0, r+3, 0, Math.PI*2);
    ctx.stroke();
  } else {
    // hover 的人＋跟他有關係的人：外框一起亮起（白框＋角色色光暈）
    const isHoverPeer = hovered && !isHovered && n.adj.some(a => a.peer.id === hovered.id);
    const lit = isHovered || isHoverPeer;
    ctx.strokeStyle = isFocused ? '#f1fa8c' : lit ? '#ffffff' : n.color+'99';
    ctx.lineWidth = isFocused ? 3 : lit ? 2.5 : 1.5;
    if (lit) { ctx.shadowColor = n.color; ctx.shadowBlur = 16; }
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI*2);
    ctx.stroke();
    if (lit) { ctx.shadowBlur = 0; }
  }

  ctx.restore();
}

// ── Label placement（避免文字重疊）─────────────────
function rectsOverlap(a, b) {
  return a.x < b.x+b.w && b.x < a.x+a.w && a.y < b.y+b.h && b.y < a.y+a.h;
}
function circleRectOverlap(cx, cy, cr, rc) {
  const nx = Math.max(rc.x, Math.min(cx, rc.x+rc.w));
  const ny = Math.max(rc.y, Math.min(cy, rc.y+rc.h));
  const dx = cx-nx, dy = cy-ny;
  return dx*dx + dy*dy < cr*cr;
}

const placedRects = [];

function drawLabels() {
  placedRects.length = 0;
  const placed = placedRects;
  // 優先權：聚焦者 > 大節點
  const order = [...NODES].sort((a, b) => {
    const fa = focused && a.id===focused.id ? 1 : 0;
    const fb = focused && b.id===focused.id ? 1 : 0;
    if (fa !== fb) return fb - fa;
    return b.size - a.size;
  });

  order.forEach(n => {
    const isFocused  = focused && n.id===focused.id;
    const isNeighbor = focused && n.adj.some(a=>a.peer.id===focused.id);
    const isActive   = mode==='overview' || isFocused || isNeighbor;
    const isHovered  = hovered && hovered.id===n.id;
    const scl = n.sclCur == null ? 1 : n.sclCur;
    const r   = n.size * scl;
    const fs  = Math.max(13, r*.46);

    ctx.font = `${fs}px "Noto Sans TC",sans-serif`;
    const w = ctx.measureText(n.label).width;

    // 候選位置：下、上、右、左、四個斜角、更遠的上下（避免擁擠排互相重疊）
    const cands = [
      { x: 0,               y:  r + 8 + fs/2 },
      { x: 0,               y: -(r + 8 + fs/2) },
      { x:  r + 6 + w/2,    y: 0 },
      { x: -(r + 6 + w/2),  y: 0 },
      { x:  (r + w/2)*.78,  y:  r*.72 + fs/2 },
      { x: -(r + w/2)*.78,  y:  r*.72 + fs/2 },
      { x:  (r + w/2)*.78,  y: -(r*.72 + fs/2) },
      { x: -(r + w/2)*.78,  y: -(r*.72 + fs/2) },
      { x: 0,               y:  r + 12 + fs*1.7 },
      { x: 0,               y: -(r + 12 + fs*1.7) },
    ];
    const rectAt = c => ({ x: n.x+c.x-w/2-2, y: n.y+c.y-fs/2-2, w: w+4, h: fs+4 });
    // 優先沿用上一幀的位置，避免閃爍
    let idxOrder = cands.map((_, i) => i);
    if (n.lpi != null && n.lpi < cands.length) idxOrder = [n.lpi, ...idxOrder.filter(i => i !== n.lpi)];

    let chosen = null, chosenIdx = 0;
    for (const i of idxOrder) {
      const rc = rectAt(cands[i]);
      let bad = placed.some(p => rectsOverlap(p, rc));
      if (!bad) bad = NODES.some(m => m !== n && circleRectOverlap(m.x, m.y, m.size*(m.sclCur||1)+4, rc));
      if (!bad) { chosen = rc; chosenIdx = i; break; }
    }
    if (!chosen) {
      // 備援：全部都會撞時，選重疊面積最小的位置
      let bestPen = Infinity;
      cands.forEach((c, i) => {
        const rc = rectAt(c);
        let pen = 0;
        placed.forEach(p => {
          if (!rectsOverlap(p, rc)) return;
          const ow = Math.min(p.x+p.w, rc.x+rc.w) - Math.max(p.x, rc.x);
          const oh = Math.min(p.y+p.h, rc.y+rc.h) - Math.max(p.y, rc.y);
          pen += ow * oh;
        });
        if (pen < bestPen) { bestPen = pen; chosen = rc; chosenIdx = i; }
      });
    }
    n.lpi = chosenIdx;
    placed.push(chosen);

    ctx.save();
    ctx.globalAlpha = (isActive ? 1 : 0.1) * (n.introA == null ? 1 : n.introA);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = isActive ? '#f8f8f2' : '#44475a';
    ctx.fillText(n.label, chosen.x + chosen.w/2, chosen.y + chosen.h/2);
    ctx.restore();
  });
}

function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function lighten(hex, amt) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
}

// ═══════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════

function worldToScreen(x, y) {
  return { x: (x-W/2)*zoom + W/2 + cx, y: (y-H/2)*zoom + H/2 + cy };
}
function screenToWorld(sx, sy) {
  return { x: (sx-W/2-cx)/zoom + W/2, y: (sy-H/2-cy)/zoom + H/2 };
}
function getNodeAt(sx, sy) {
  const w = screenToWorld(sx, sy);
  let best=null, bestD=Infinity;
  NODES.forEach(n => {
    const dx=n.x-w.x, dy=n.y-w.y, d=Math.sqrt(dx*dx+dy*dy);
    if (d < n.size*1.6 && d<bestD) { bestD=d; best=n; }
  });
  return best;
}

function frame() {
  // Idle drift：總覽模式下角色小幅度飄移
  const t = performance.now()/1000;
  nowT = t;
  const drifting = mode === 'overview';
  // Lerp positions + 進場進度
  NODES.forEach(n => {
    n.introA = n.introDelay == null ? 1 : Math.min(1, Math.max(0, (t - n.introDelay) / .45));
    // 縮放平滑過渡：聚焦者放大到比相連角色都大，離開後回復
    const tScl = (focused && n.id===focused.id) ? (n.fScl || 1.35)
               : (hovered && hovered.id===n.id) ? 1.12 : 1;
    n.sclCur = lerp(n.sclCur == null ? 1 : n.sclCur, tScl, .12);
    if (n.introA <= 0) return;  // 尚未輪到出場
    let dx = 0, dy = 0;
    if (drifting) {
      const amp = layoutMode === 'tree' ? .35 : 1;  // 族譜模式減小飄移，保持排列整齊
      dx = (Math.sin(t*n.dSpeed1 + n.dPhase1) + Math.sin(t*n.dSpeed2*1.7 + n.dPhase2)*.5) * n.dAmp * amp;
      dy = (Math.cos(t*n.dSpeed2 + n.dPhase2) + Math.cos(t*n.dSpeed1*1.3 + n.dPhase1)*.5) * n.dAmp * amp;
    }
    n.x = lerp(n.x, n.tx + dx, .07);
    n.y = lerp(n.y, n.ty + dy, .07);
  });
  // Lerp camera
  cx = lerp(cx, tcx, .08);
  cy = lerp(cy, tcy, .08);
  zoom = lerp(zoom, tzoom, .08);

  drawBackground();

  ctx.save();
  ctx.translate(W/2+cx, H/2+cy);
  ctx.scale(zoom, zoom);
  ctx.translate(-W/2, -H/2);

  drawGenRuler();

  // Draw unique edges (one pass, deduplicated visually by index)
  const drawnPairs = new Set();
  EDGES.forEach(e => {
    const key = [e.s,e.t].sort().join('|') + e.label;
    if (drawnPairs.has(key)) return;
    drawnPairs.add(key);
    drawEdge(e);
  });

  NODES.forEach(n => drawNode(n));
  drawLabels();
  drawEdgeLabels();
  drawRipples(t);
  ctx.restore();

  requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════

let dragStart=null, camStart=null, didDrag=false, dragNode=null;
let lastTap=0, lastTapNode=null;

canvas.addEventListener('mousedown', e => {
  dragStart = {x:e.clientX, y:e.clientY};
  camStart  = {x:cx, y:cy};
  dragNode  = mode==='overview' ? getNodeAt(e.clientX, e.clientY) : null;
  didDrag   = false;
});
canvas.addEventListener('mousemove', e => {
  if (dragStart) {
    const dx=e.clientX-dragStart.x, dy=e.clientY-dragStart.y;
    if (Math.sqrt(dx*dx+dy*dy)>4) {
      didDrag=true;
      if (dragNode) {
        // 拖曳角色：手動微調位置
        const w = screenToWorld(e.clientX, e.clientY);
        dragNode.tx = dragNode.ox = w.x;
        dragNode.ty = dragNode.oy = w.y;
      } else {
        tcx = camStart.x+dx; tcy = camStart.y+dy;
      }
      canvas.className='grabbing';
    }
  } else {
    hovered = getNodeAt(e.clientX, e.clientY);
    canvas.className = hovered ? 'pointer' : '';
  }
});
canvas.addEventListener('mouseup', e => {
  if (!didDrag) {
    const node = getNodeAt(e.clientX, e.clientY);
    if (node) {
      setFocus(node);
    } else if (mode==='focus') {
      resetOverview();
    }
  }
  dragStart=null; camStart=null; dragNode=null;
  canvas.className = hovered ? 'pointer' : '';
});
canvas.addEventListener('mouseleave', () => { dragStart=null; hovered=null; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tzoom = Math.max(.25, Math.min(3.5, tzoom * (e.deltaY>0 ? .9 : 1.11)));
}, { passive:false });

// Touch
let tstart=null, tcamStart=null, tDidDrag=false, tPinchDist=0;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length===1) {
    tstart = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    tcamStart = {x:cx, y:cy};
    tDidDrag = false;
  } else if (e.touches.length===2) {
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    tPinchDist = Math.sqrt(dx*dx+dy*dy);
  }
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length===1 && tstart) {
    const dx=e.touches[0].clientX-tstart.x, dy=e.touches[0].clientY-tstart.y;
    if (Math.sqrt(dx*dx+dy*dy)>8) {
      tDidDrag=true;
      tcx=tcamStart.x+dx; tcy=tcamStart.y+dy;
    }
  } else if (e.touches.length===2) {
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.sqrt(dx*dx+dy*dy);
    tzoom = Math.max(.25, Math.min(3.5, tzoom*(d/tPinchDist)));
    tPinchDist=d;
  }
}, {passive:false});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!tDidDrag && tstart) {
    const node = getNodeAt(tstart.x, tstart.y);
    if (node) setFocus(node);
    else if (mode==='focus') resetOverview();
  }
  tstart=null;
}, {passive:false});

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════

// Seed positions by group before simulation
const GROUP_POS = {
  main:       {x:  0, y:-80},
  staff:      {x:220, y:-120},
  child:      {x: 40, y:160},
  grandchild: {x: 80, y:350},
  partner:    {x:280, y:220},
  friend:     {x:-300, y:80},
  other:      {x:-220, y:200},
};

NODES.forEach((n,i) => {
  const gp = GROUP_POS[n.group] || {x:0,y:0};
  const angle = (i*2.39996) % (Math.PI*2);
  const r = 40+Math.random()*70;
  n.x = W/2 + gp.x + Math.cos(angle)*r;
  n.y = H/2 + gp.y + Math.sin(angle)*r;
  n.vx=0; n.vy=0;
});

runSim(600);
separateCircles();   // 星圖：保證圓框不互相重疊
storeOverview();
NODES.forEach(n => { n.gx = n.x; n.gy = n.y; }); // 保存散狀布局位置供切換回星圖用

// 搜尋角色
const dl = document.getElementById('names');
NODES.forEach(n => {
  const o = document.createElement('option');
  o.value = n.label;
  dl.appendChild(o);
});
const searchEl = document.getElementById('search');
searchEl.addEventListener('change', () => {
  const q = searchEl.value.trim().toLowerCase();
  if (!q) return;
  const node = NODES.find(n => n.label.toLowerCase() === q)
            || NODES.find(n => n.label.toLowerCase().includes(q));
  if (node) { setFocus(node); searchEl.blur(); }
});

// 進場動畫：依世代順序 stagger 彈出
{
  const introDepth = computeDepths();
  const t0 = performance.now()/1000;
  NODES.forEach(n => {
    const d = Math.max(0, introDepth[n.id] || 0);
    n.introDelay = t0 + .15 + d*.3 + Math.random()*.2;
    n.introA = 0;
    // 從各自位置往中心收 85%，出場時展開
    n.x = W/2 + (n.gx - W/2)*.15;
    n.y = H/2 + (n.gy - H/2)*.15;
  });
}

frame();
</script>
